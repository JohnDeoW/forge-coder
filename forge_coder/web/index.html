<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeCoder 面板</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2228; --muted: #6b7380; --border: #dfe3e8;
    --accent: #2f6fdf; --add: #e6f6ea; --add-text: #1a7f37; --del: #fdecec; --del-text: #c62828;
    --hunk: #eef3fd; --tool: #f1f4f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181c; --panel: #1d2126; --text: #e4e7eb; --muted: #8b939e; --border: #2e343b;
      --accent: #6ea0ff; --add: #15301f; --add-text: #6fd28a; --del: #3a1c1c; --del-text: #ff8a80;
      --hunk: #1d2a40; --tool: #23282e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; }
  #status { color: var(--muted); font-size: 13px; }
  .actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }
  button { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 6px; padding: 5px 12px; cursor: pointer; font: inherit; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 12px 16px; height: calc(100vh - 56px); }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; min-height: 0; }
  section h2 { font-size: 13px; margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--muted); font-weight: 600; }
  #timeline, #review { flex: 1; overflow: auto; padding: 10px 12px; }
  .msg { margin: 8px 0; white-space: pre-wrap; word-break: break-word; }
  .user { font-weight: 600; }
  .user::before { content: "你："; color: var(--accent); }
  .tool { background: var(--tool); border-radius: 6px; padding: 4px 8px; font: 12px/1.5 ui-monospace, Consolas, monospace; }
  .tool .result { color: var(--muted); }
  .tool.task { border-left: 3px solid var(--accent); }
  .tool.sub { margin-left: 22px; border-left: 2px solid var(--border); }
  .todo { border: 1px dashed var(--border); border-radius: 6px; padding: 4px 8px; font-size: 13px; }
  .step { color: var(--accent); font-weight: 600; }
  .approval { border: 1px solid var(--accent); border-radius: 6px; padding: 6px 8px; }
  .approval .result { color: var(--muted); font-size: 13px; }
  label.mode { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  select { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 6px; padding: 4px 6px; font: inherit; }
  details.record { border-bottom: 1px solid var(--border); padding: 4px 0; }
  details.record summary { cursor: pointer; font-size: 13px; }
  details.record pre { white-space: pre-wrap; word-break: break-all; margin-top: 6px; }
  .approval-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .thought { color: var(--muted); font-style: italic; }
  .meta { color: var(--muted); font-size: 12px; }
  .commit { color: var(--add-text); font-size: 12px; }
  .error { color: var(--del-text); }
  form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  textarea { flex: 1; resize: vertical; min-height: 40px; max-height: 160px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  pre { margin: 0; font: 12px/1.5 ui-monospace, Consolas, monospace; }
  pre span { display: block; white-space: pre-wrap; word-break: break-all; padding: 0 6px; }
  .d-add { background: var(--add); color: var(--add-text); }
  .d-del { background: var(--del); color: var(--del-text); }
  .d-hunk { background: var(--hunk); color: var(--accent); }
  .d-meta { color: var(--muted); }
  .empty { color: var(--muted); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } section { height: 70vh; } }
</style>
</head>
<body>
<header>
  <h1>ForgeCoder</h1>
  <label class="mode">模式
    <select id="mode" title="plan 只读规划 · auto 辅助 Agent 自动审批 · manual 人工审批">
      <option value="plan">plan · 规划</option>
      <option value="auto">auto · 自动审批</option>
      <option value="manual">manual · 人工审批</option>
    </select>
  </label>
  <span id="status">加载中…</span>
  <div class="actions">
    <button id="btn-diff">查看改动</button>
    <button id="btn-log">修改记录</button>
    <button id="btn-approvals">审批记录</button>
    <button id="btn-accept" class="primary">接受合并</button>
    <button id="btn-reject">丢弃任务</button>
    <button id="btn-reset">还原测试项目</button>
  </div>
</header>
<main>
  <section>
    <h2>对话与 Agent 步骤</h2>
    <div id="timeline"><p class="empty">输入需求开始一个任务。Agent 的改动只发生在独立的 worktree 中，审查后再决定是否合并。</p></div>
    <form id="chat">
      <textarea id="input" placeholder="例如：修复出库时库存不足没有报错的问题；以 /plansolve 开头则用 PlanSolve 范式执行（Ctrl+Enter 发送）"></textarea>
      <button class="primary" id="send">发送</button>
    </form>
  </section>
  <section>
    <h2 id="review-title">改动审查</h2>
    <div id="review"><p class="empty">点击“查看改动”或“修改记录”。</p></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const timeline = $("timeline");
let busy = false;
let hasTask = false;

function add(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  timeline.querySelector(".empty")?.remove();
  timeline.appendChild(el);
  timeline.scrollTop = timeline.scrollHeight;
  return el;
}

function short(value, limit = 300) {
  const text = typeof value === "string" ? value : JSON.stringify(value);
  return text.length > limit ? text.slice(0, limit) + "…" : text;
}

function setStatus(s) {
  hasTask = !!s.task;
  $("mode").value = s.mode;
  $("status").textContent = `项目 ${s.repo} · 模型 ${s.model} · ` +
    (s.task ? `任务 ${s.task}（${s.branch}，已提交 ${s.rounds} 轮）` : "无进行中的任务");
  updateButtons();
}

function updateButtons() {
  for (const id of ["btn-diff", "btn-log", "btn-approvals", "btn-accept", "btn-reject"]) $(id).disabled = busy || !hasTask;
  $("btn-reset").disabled = busy;
  $("send").disabled = busy;
  $("mode").disabled = busy;
}

async function api(path, method = "GET") {
  const res = await fetch(path, { method });
  const body = await res.json();
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}

function renderDiff(text) {
  if (!text.trim()) return '<p class="empty">当前任务没有改动。</p>';
  const pre = document.createElement("pre");
  for (const line of text.split("\n")) {
    const span = document.createElement("span");
    if (/^(\+\+\+|---|diff --git|index |new file|deleted file)/.test(line)) span.className = "d-meta";
    else if (line.startsWith("+")) span.className = "d-add";
    else if (line.startsWith("-")) span.className = "d-del";
    else if (line.startsWith("@@")) span.className = "d-hunk";
    span.textContent = line || " ";
    pre.appendChild(span);
  }
  return pre.outerHTML;
}

async function showDiff() {
  $("review-title").textContent = "改动审查（相对 main 的全部改动）";
  $("review").innerHTML = renderDiff((await api("/api/diff")).text);
}

async function showLog() {
  $("review-title").textContent = "修改记录（每轮对话一次提交）";
  const text = (await api("/api/log")).text;
  $("review").innerHTML = text.trim() ? "" : '<p class="empty">还没有提交记录。</p>';
  if (text.trim()) { const pre = document.createElement("pre"); pre.textContent = text; $("review").appendChild(pre); }
}

const MAIN = "forge-coder";
const TODO_MARK = { pending: "☐", in_progress: "▶", completed: "✔" };

function attachResult(ev) {
  const id = `${ev.agent}:${ev.data.tool_call_id || ""}`;
  const el = timeline.querySelector(`[data-call-id="${CSS.escape(id)}"]`);
  if (el) { const r = document.createElement("div"); r.className = "result"; r.textContent = "↳ " + short(ev.data.result); el.appendChild(r); }
}

function handleSub(ev) {
  // 子 Agent 只展示工具步骤，结论通过主 Agent 的 Task 结果返回
  const d = ev.data;
  if (ev.type === "tool_call_start" && d.tool_name !== "Finish") {
    const text = d.tool_name === "Thought" ? "💭 " + (d.args?.reasoning || "") : `🔧 ${d.tool_name} ${short(d.args || {}, 160)}`;
    const el = add("tool sub", `[${ev.agent}] ${text}`);
    el.dataset.callId = `${ev.agent}:${d.tool_call_id || ""}`;
  } else if (ev.type === "tool_call_finish" && !["Thought", "Finish"].includes(d.tool_name)) {
    attachResult(ev);
  }
}

function handleApproval(d) {
  // 白名单外命令：显示确认卡片，用户选择后通知服务端，等待中的工具调用随即继续
  const el = add("approval", `⚠ 需要确认：${d.reason || d.tool_name}`);
  const box = document.createElement("div");
  box.className = "approval-actions";
  for (const [answer, label] of [["once", "允许本次"], ["always", "本会话总是允许"], ["deny", "拒绝"]]) {
    const btn = document.createElement("button");
    btn.textContent = label;
    if (answer === "once") btn.className = "primary";
    btn.onclick = async () => {
      box.querySelectorAll("button").forEach(b => b.disabled = true);
      const res = await fetch("/api/approval", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ request_id: d.request_id, answer }) });
      box.textContent = res.ok ? `已选择：${label}` : "审批已失效（可能已超时）";
    };
    box.appendChild(btn);
  }
  el.appendChild(box);
}

function handleAutoApproval(d) {
  // auto 模式：审批助手的决定、风险与理由直接显示在对应工具调用之后
  const el = add("approval", `🛡 审批助手：${d.approved ? "允许" : "拒绝"}（风险 ${d.risk}）${d.summary || ""}`);
  const reason = document.createElement("div");
  reason.className = "result";
  reason.textContent = "理由：" + (d.reason || "");
  el.appendChild(reason);
}

async function showApprovals() {
  $("review-title").textContent = "审批记录（本任务）";
  const records = (await api("/api/approvals")).records;
  if (!records.length) { $("review").innerHTML = '<p class="empty">本任务还没有审批记录。</p>'; return; }
  $("review").innerHTML = "";
  records.forEach((r, i) => {
    const box = document.createElement("details");
    box.className = "record";
    const head = document.createElement("summary");
    head.textContent = `${i + 1}. [${r.time}] ${r.mode} · ${r.by} · ${r.approved ? "允许" : "拒绝"} · ${r.tool}: ${short(r.operation, 80)}`;
    const body = document.createElement("pre");
    // 默认折叠，展开后可看到辅助 Agent 的完整对话（提示词与原始回复）
    body.textContent = JSON.stringify(r, null, 2);
    box.append(head, body);
    $("review").appendChild(box);
  });
}

function handle(ev) {
  const d = ev.data;
  if (ev.type === "approval_required") return handleApproval(d);
  if (ev.type === "approval_resolved") return handleAutoApproval(d);
  if (ev.agent && ev.agent !== MAIN && ev.type !== "turn_end") return handleSub(ev);
  if (ev.type === "agent_start") {
    api("/api/status").then(setStatus);  // 首条需求会新建任务，及时刷新顶部状态
  } else if (ev.type === "tool_call_start") {
    if (d.tool_name === "Thought") add("thought", "💭 " + (d.args?.reasoning || ""));
    else if (d.tool_name === "TodoWrite") {
      add("todo", "📝 待办清单\n" + (d.args?.todos || []).map(t => `${TODO_MARK[t.status] || "·"} ${t.content}`).join("\n"));
    } else if (d.tool_name !== "Finish") {
      const label = d.tool_name === "Task" ? `🤖 派出子 Agent [${d.args?.role}] ${short(d.args?.task || "", 200)}` : `🔧 ${d.tool_name} ${short(d.args || {}, 200)}`;
      const el = add(d.tool_name === "Task" ? "tool task" : "tool", label);
      el.dataset.callId = `${ev.agent}:${d.tool_call_id || ""}`;
    }
  } else if (ev.type === "tool_call_finish") {
    // 子 Agent 的结论放在其步骤之后显示，其余工具结果挂在对应调用下
    if (d.tool_name === "Task") add("tool task", "↳ " + short(d.result, 600));
    else if (d.tool_name !== "TodoWrite") attachResult(ev);
  } else if (ev.type === "step_finish" && d.phase === "planning") {
    add("todo", "📋 执行计划\n" + (d.plan || []).map((s, i) => `${i + 1}. ${s}`).join("\n"));
  } else if (ev.type === "step_start" && d.phase === "execution") {
    add("meta step", `▶ 步骤 ${d.step}/${d.total_steps}：${d.description}`);
  } else if (ev.type === "agent_finish") {
    add("answer", d.result || "");
    add("meta", `[${d.status} · 主 Agent ${d.total_steps} 步 · ${d.total_tokens} tokens]`);
  } else if (ev.type === "error") {
    add("error", "错误：" + d.error);
  } else if (ev.type === "turn_end") {
    if (d.usage) add("meta", `本轮用量：${d.usage.total_tokens} tokens · ${d.usage.model_calls} 次模型调用 · ${d.usage.elapsed_s}s（` + Object.entries(d.usage.shares).sort((a, b) => b[1] - a[1]).map(([n, s]) => `${n} ${Math.round(s * 100)}%`).join(" · ") + "）");
    if (d.context) {
      const k = (n) => (n / 1000).toFixed(1) + "k";
      add("meta", `上下文窗口：${k(d.context.used)} / ${k(d.context.window)}（` +
        Object.entries(d.context.breakdown).sort((a, b) => b[1] - a[1]).map(([n, v]) => `${n} ${k(v)}`).join(" · ") + "）");
    }
    if (d.commit) add("commit", `✔ 本轮改动已提交（${d.commit}）`);
    setStatus(d.status);
    if (d.commit) showDiff();
  }
}

async function send(text) {
  busy = true; updateButtons();
  add("user", text);
  try {
    // 以 /plansolve 开头时用框架的 PlanSolve 范式（先规划再逐步执行）完成这一轮，作为范式演示
    const ps = text.startsWith("/plansolve ");
    const body = { text: ps ? text.slice(11).trim() : text, paradigm: ps ? "plansolve" : "react" };
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const chunk = buffer.slice(0, idx); buffer = buffer.slice(idx + 2);
        if (chunk.startsWith("data: ")) handle(JSON.parse(chunk.slice(6)));
      }
    }
  } catch (err) {
    add("error", "请求失败：" + err.message);
  } finally {
    busy = false; updateButtons();
  }
}

async function action(fn) {
  busy = true; updateButtons();
  try { await fn(); } catch (err) { add("error", err.message); } finally { busy = false; updateButtons(); }
}

$("chat").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (text && !busy) { $("input").value = ""; send(text); }
});
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.ctrlKey) $("chat").requestSubmit(); });
$("btn-diff").onclick = () => action(showDiff);
$("btn-log").onclick = () => action(showLog);
$("btn-approvals").onclick = () => action(showApprovals);
$("mode").onchange = () => action(async () => {
  const res = await fetch("/api/mode", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode: $("mode").value }) });
  const body = await res.json();
  if (!res.ok) throw new Error(body.detail || res.statusText);
  add("meta", `已切换到 ${body.mode} 模式，下一轮生效`); setStatus(body);
});
$("btn-accept").onclick = () => action(async () => {
  if (!confirm("将当前任务的改动合并到 main？")) return;
  const r = await api("/api/accept", "POST");
  add("commit", `✔ 已合并到 main（${r.commit}），任务结束`); setStatus(r.status);
  $("review").innerHTML = '<p class="empty">任务已合并到 main。</p>';
});
$("btn-reject").onclick = () => action(async () => {
  if (!confirm("丢弃当前任务的全部改动？")) return;
  const r = await api("/api/reject", "POST");
  add("meta", "已丢弃当前任务，main 未受影响"); setStatus(r.status);
  $("review").innerHTML = '<p class="empty">任务已丢弃。</p>';
});
$("btn-reset").onclick = () => action(async () => {
  if (!confirm("把测试项目还原到初始状态？所有任务分支与已合并的改动都会被清除。")) return;
  const r = await api("/api/reset", "POST");
  timeline.innerHTML = ""; add("meta", "已还原测试项目到初始状态，对话已清空"); setStatus(r.status);
  $("review").innerHTML = '<p class="empty">点击“查看改动”或“修改记录”。</p>';
});
api("/api/status").then(setStatus);
</script>
</body>
</html>
